<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Business Communication Globe</title>
    <style>
        body {
            margin: 0;
            overflow-x: hidden; /* Hide horizontal scroll */
            background-color: #050510; /* Deep space blue/black */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }

        #canvas_container {
            position: fixed; /* Fix the canvas so it stays while scrolling */
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            z-index: 1;
        }

        /* Content Overlay */
        .content-wrapper {
            position: relative;
            z-index: 2;
            width: 100%;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            pointer-events: none; /* Let clicks pass through to canvas if needed, but re-enable for buttons */
        }

        .hero-text {
            margin-top: 15vh; /* Push text down slightly to sit over the globe curve */
            padding: 0 20px;
            pointer-events: auto;
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            line-height: 1.2;
            text-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        h1 span {
            color: #4facfe; /* Light blue accent */
        }

        p {
            font-size: 1.2rem;
            color: #ccc;
            max-width: 600px;
            margin: 0 auto 2rem auto;
            text-shadow: 0 2px 5px rgba(0,0,0,0.5);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            pointer-events: auto;
        }

        .btn {
            padding: 12px 30px;
            border-radius: 30px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .btn-primary {
            background: linear-gradient(90deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            box-shadow: 0 0 15px rgba(79, 172, 254, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 25px rgba(79, 172, 254, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            color: white;
            backdrop-filter: blur(5px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        /* Dummy content to allow scrolling */
        .scroll-spacer {
            height: 100vh;
        }
    </style>
</head>
<body>

    <div id="canvas_container"></div>

    <div class="content-wrapper">
        <div class="hero-text">
            <h1>The Smarter way to Run & Scale<br>Your <span>Business Communication</span></h1>
            <p>AI-powered unified communications for calling, messaging, meetings, and automation — all in one platform.</p>
            <div class="btn-group">
                <a href="#" class="btn btn-primary">Request Demo</a>
                <a href="#" class="btn btn-secondary">Buy Now</a>
            </div>
        </div>
    </div>

    <!-- Spacer to enable scrolling -->
    <div class="scroll-spacer"></div>

    <!-- Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.121.1/build/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/simplex-noise/2.4.0/simplex-noise.min.js"></script>

    <script>
        let scene, camera, renderer;
        let earth, atmosphere, stars;
        let container = document.getElementById("canvas_container");
        
        // Scroll variables
        let scrollY = 0;
        let targetScrollY = 0;

        init();
        animate();

        function init() {
            // Scene Setup
            scene = new THREE.Scene();
            
            // Camera
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 120; // Start closer
            
            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x333333);
            scene.add(ambientLight);

            const sunLight = new THREE.DirectionalLight(0xffffff, 1.5);
            sunLight.position.set(50, 30, 50);
            scene.add(sunLight);
            
            const backLight = new THREE.DirectionalLight(0x4455ff, 0.5); // Blue rim light
            backLight.position.set(-50, 0, -50);
            scene.add(backLight);

            // --- EARTH ---
            // Using a high-res texture map for realism
            const textureLoader = new THREE.TextureLoader();
            const earthMap = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_atmos_2048.jpg');
            const earthSpecular = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_specular_2048.jpg');
            const earthNormal = textureLoader.load('https://raw.githubusercontent.com/mrdoob/three.js/master/examples/textures/planets/earth_normal_2048.jpg');

            const earthGeometry = new THREE.SphereGeometry(40, 64, 64);
            const earthMaterial = new THREE.MeshPhongMaterial({
                map: earthMap,
                specularMap: earthSpecular,
                normalMap: earthNormal,
                specular: new THREE.Color(0x333333),
                shininess: 15
            });
            earth = new THREE.Mesh(earthGeometry, earthMaterial);
            
            // Initial Position: High up so only bottom is visible
            earth.position.y = 25; 
            scene.add(earth);

            // --- ATMOSPHERE GLOW ---
            // Custom shader for the glow effect seen in the image
            const vertexShader = `
                varying vec3 vNormal;
                void main() {
                    vNormal = normalize(normalMatrix * normal);
                    gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                }
            `;

            const fragmentShader = `
                varying vec3 vNormal;
                void main() {
                    float intensity = pow(0.6 - dot(vNormal, vec3(0, 0, 1.0)), 4.0);
                    gl_FragColor = vec4(0.3, 0.6, 1.0, 1.0) * intensity;
                }
            `;

            const atmosphereGeometry = new THREE.SphereGeometry(42, 64, 64);
            const atmosphereMaterial = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                blending: THREE.AdditiveBlending,
                side: THREE.BackSide,
                transparent: true
            });

            atmosphere = new THREE.Mesh(atmosphereGeometry, atmosphereMaterial);
            atmosphere.position.copy(earth.position);
            scene.add(atmosphere);

            // --- STARS ---
            const starGeometry = new THREE.BufferGeometry();
            const starCount = 2000;
            const posArray = new Float32Array(starCount * 3);
            
            for(let i = 0; i < starCount * 3; i++) {
                posArray[i] = (Math.random() - 0.5) * 400; // Spread stars wide
            }
            
            starGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            const starMaterial = new THREE.PointsMaterial({
                size: 0.2,
                color: 0xffffff,
                transparent: true,
                opacity: 0.8
            });
            
            stars = new THREE.Points(starGeometry, starMaterial);
            scene.add(stars);

            // Event Listeners
            window.addEventListener('resize', onWindowResize, false);
            window.addEventListener('scroll', onScroll, false);
        }

        function onScroll() {
            // Get scroll percentage
            const maxScroll = document.body.scrollHeight - window.innerHeight;
            targetScrollY = window.scrollY / maxScroll;
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Smooth Scroll Interpolation
            scrollY += (targetScrollY - scrollY) * 0.05;

            // 1. Rotate Earth slowly
            earth.rotation.y += 0.001;
            atmosphere.rotation.y += 0.001;

            // 2. Scroll Effect: Move Earth Down as user scrolls down
            // This simulates the earth rising or the camera moving down
            // Initial Y is 25. We want it to go down to maybe -20 or lower
            const startHeight = 25;
            const endHeight = -30;
            earth.position.y = startHeight + (endHeight - startHeight) * scrollY;
            atmosphere.position.y = earth.position.y;

            // 3. Parallax Stars: Move stars slightly opposite to scroll
            stars.position.y = scrollY * 10;
            stars.rotation.y -= 0.0002;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
