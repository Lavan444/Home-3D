/* =========================================================
GLOBAL

========================================================= */

    inset 0 0 30px 8px rgba(255,255,255,0.55),

/* =========================================================
CONTENT

}

.vitelHeroDesc{

    color:#d4d7e8;
    line-height:1.7;
}

/* =========================================================
BUTTONS
========================================================= */

.vitelHeroButtons{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:20px;
}

.vitelHeroBtn{

    color:white;
    border:1px solid rgba(255,255,255,0.4);

ASTRONAUT
========================================================= */

#vitelAstronaut{

    bottom:0px;
    left:50%;
    transform:translateX(-50%);
    width:auto;
    z-index:10;

    filter:
    drop-shadow(0 0 40px rgba(255,255,255,0.35))
    drop-shadow(0 0 80px rgba(129,160,255,0.25));

}

    0%{

        translateX(-50%)

    }

        translateX(-50%)

    }

        translateX(-50%)

    }

}

/* =========================================================
SERVICES FLAGS
========================================================= */

.vitelServicesWrap{
    position:absolute;
    width:100%;

/* FLAG LINE */

    content:"";
    width:2px;

    background:
    linear-gradient(

    rgba(255,255,255,0.6),
    transparent);
}

/* FLAG DOT */

.vitelServiceFlag::before{
    content:"";
    position:absolute;
    bottom:-6px;
    width:12px;

    border-radius:50%;
    background:rgba(255,255,255,0.6);

    box-shadow:
    0 0 10px rgba(255,255,255,0.7);
}

.vitelServiceFlag--offset{
    transform: translate(100px, -100px);
}


.vitelsmsFlag{
   transform: translate(150px, -190px);
}

.vitelomniflag{

}

/* SERVICE CARD */

.vitelServiceCard{

/* =========================================================
RESPONSIVE
========================================================= */

<script>

/* =========================================================
THREE JS WEBGL
========================================================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
canvas:document.getElementById("vitelWebGLCanvas"),
alpha:true,
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

camera.position.z = 5;

/* =========================================================
STARS
========================================================= */

const starsGeometry =
new THREE.BufferGeometry();

const starsCount = 5000;

const starsPositions = [];

for(let i=0;i<starsCount;i++){

    starsPositions.push(
        (Math.random()-0.5)*2000,
        (Math.random()-0.5)*2000,
        (Math.random()-0.5)*2000
    );

}

starsGeometry.setAttribute(
"position",
new THREE.Float32BufferAttribute(
starsPositions,
3
)
);

const starsMaterial =
new THREE.PointsMaterial({
color:"#ffffff",
size:1
});

const stars =
new THREE.Points(
starsGeometry,
starsMaterial
);

scene.add(stars);

/* =========================================================
3D GLOBE
========================================================= */

const globeGeometry =
new THREE.SphereGeometry(
8,
128,
128
);

const globeTexture =
new THREE.TextureLoader().load(
"./moon-bg.png"
);

const globeMaterial =
new THREE.MeshStandardMaterial({
map:globeTexture,
roughness:1
});

const globe =
new THREE.Mesh(
globeGeometry,
globeMaterial
);

scene.add(globe);

globe.position.set(0,7,-3);

/* =========================================================
LIGHTS
========================================================= */

const ambientLight =
new THREE.AmbientLight(
0xffffff,
1.5
);

scene.add(ambientLight);

const directionalLight =
new THREE.DirectionalLight(
0xffffff,
3
);

directionalLight.position.set(
5,
5,
5
);

scene.add(directionalLight);

/* =========================================================
ANIMATE
========================================================= */

function animate(){

    requestAnimationFrame(animate);

    globe.rotation.y += 0.0015;

    stars.rotation.y += 0.0002;

    renderer.render(scene,camera);

}

animate();

/* =========================================================
RESIZE
========================================================= */

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

/* =========================================================
ASTRONAUT MOVEMENT TO FLAGS
========================================================= */

const vitelAstronaut =
document.getElementById(
"vitelAstronaut"
);

// Get all flag elements
const flagElements =
document.querySelectorAll(
".vitelServiceFlag"
);

// Convert NodeList to Array for easier handling
const flags = Array.from(flagElements);

// Distance threshold - if mouse is beyond this, astronaut returns to center
const INTERACTION_THRESHOLD = 400;

// Function to calculate distance between mouse and flag
function getDistance(
mouseX,
mouseY,
flagX,
flagY
){
    const dx = mouseX - flagX;
    const dy = mouseY - flagY;
    return Math.sqrt(dx*dx + dy*dy);
}

// Function to get flag center position
function getFlagPosition(flagElement){
    const rect = flagElement.getBoundingClientRect();
    return {
        x: rect.left + rect.width/2,
        y: rect.top + rect.height/2
    };
}

// Function to find closest flag to mouse
function getClosestFlag(mouseX, mouseY){
    let closestFlag = null;
    let closestDistance = Infinity;

    flags.forEach(flag=>{
        const flagPos = getFlagPosition(flag);
        const distance = getDistance(
            mouseX,
            mouseY,
            flagPos.x,
            flagPos.y
        );

        if(distance < closestDistance){
            closestDistance = distance;
            closestFlag = flag;
        }
    });

    return {
        flag: closestFlag,
        distance: closestDistance
    };
}

// Track mouse movement and move astronaut to closest flag
document.addEventListener(
"mousemove",
(e)=>{

    // Find closest flag to mouse
    const {flag: closestFlag, distance: closestDistance} =
    getClosestFlag(
        e.clientX,
        e.clientY
    );

    // If mouse is close to a flag, move astronaut to it
    if(closestFlag && closestDistance < INTERACTION_THRESHOLD){
        // Get flag position
        const flagRect =
        closestFlag.getBoundingClientRect();

        const flagCenterX =
        flagRect.left +
        flagRect.width/2 -
        window.innerWidth/2;

        // Move astronaut to flag position
        gsap.to(
            vitelAstronaut,
            {
                x: flagCenterX,
                duration: 0.8,
                ease: "power3.out"
            }
        );
    }
    else{
        // Mouse is far from all flags, move astronaut back to center
        gsap.to(
            vitelAstronaut,
            {
                x: 0,
                duration: 0.8,
                ease: "power3.out"
            }
        );
    }

});

/* =========================================================
SERVICE HOVER MOVEMENT
========================================================= */

const vitelServices =
document.querySelectorAll(
".vitelServiceCard"
);

vitelServices.forEach((service, index)=>{

    service.addEventListener(
        "mouseenter",
        ()=>{

            // Get parent flag element
            const parentFlag =
            service.closest(
                ".vitelServiceFlag"
            );

            const flagRect =
            parentFlag
            .getBoundingClientRect();

            const targetX =
            flagRect.left +
            flagRect.width/2 -
            window.innerWidth/2;

            gsap.to(
                vitelAstronaut,
                {
                    x: targetX,
                    duration: 0.6,
                    ease: "power3.out"
                }
            );

        }
    );

});

/* =========================================================
GSAP ANIMATION
========================================================= */

gsap.registerPlugin(
ScrollTrigger
);

gsap.from(
".vitelHeroTitle",
{
y:120,
opacity:0,
duration:1.5
}
);

gsap.from(
".vitelHeroDesc",
{
y:80,
opacity:0,
duration:1.5,
delay:0.3
}
);

gsap.from(
".vitelHeroButtons",
{
y:80,
opacity:0,
duration:1.5,
delay:0.5
}
);

gsap.from(
".vitelServiceFlag",
{
y:80,
opacity:0,
stagger:0.15,
duration:1.2,
delay:0.8
}
);

/* =========================================================
SCROLL BASED ANIMATION
========================================================= */

gsap.to(
globe.rotation,
{
y:6,

scrollTrigger:{
trigger:"#vitelHeroBanner",
start:"top top",
end:"bottom top",
scrub:1
}
}
);

gsap.to(
camera.position,
{
z:3,

scrollTrigger:{
trigger:"#vitelHeroBanner",
start:"top top",
end:"bottom top",
scrub:1
}
}
);

</script>

<script>
    //This code is outdated. For the latest version of the project, check here: https://codepen.io/isladjan/full/vEBdwOP

//Author: isladjan - https://isladjan.com/

let renderer,
scene,
camera,
sphereBg,
nucleus,
stars,
controls,
clock,
container = document.getElementById("canvas_container"),
timeout_Debounce,
noise = new SimplexNoise(),
cameraSpeed = 0,
blobScale = 3,
delta = 0;


init();
limitFPS(1 / 60);


function init() {
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.01, 1000)
    camera.position.set(0,0,230);

    const directionalLight = new THREE.DirectionalLight("#fff", 1);
    directionalLight.position.set(0, 50, -20);
    scene.add(directionalLight);

    let ambientLight = new THREE.AmbientLight("#ffffff", 1);
    ambientLight.position.set(0, 20, 20);
    scene.add(ambientLight);

    renderer = new THREE.WebGLRenderer({
        antialias: true,
        alpha: true
    });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    container.appendChild(renderer.domElement);
  
   clock = new THREE.Clock();

    //OrbitControl
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.autoRotate = true;
    controls.autoRotateSpeed = 4;
    controls.maxDistance = 350;
    controls.minDistance = 150;
    controls.enablePan = false;

    const loader = new THREE.TextureLoader();
    const textureSphereBg = loader.load('https://i.ibb.co/HC0vxMw/sky2.jpg');
    const texturenucleus = loader.load('https://i.ibb.co/hcN2qXk/star-nc8wkw.jpg');
    const textureStar = loader.load("https://i.ibb.co/ZKsdYSz/p1-g3zb2a.png");
    const texture1 = loader.load("https://i.ibb.co/F8by6wW/p2-b3gnym.png");  
    const texture2 = loader.load("https://i.ibb.co/yYS2yx5/p3-ttfn70.png");
    const texture4 = loader.load("https://i.ibb.co/yWfKkHh/p4-avirap.png");


    /*  Nucleus  */   
    texturenucleus.anisotropy = 16;
    let icosahedronGeometry = new THREE.IcosahedronGeometry(30, 10);
    let lambertMaterial = new THREE.MeshPhongMaterial({ map: texturenucleus });
    nucleus = new THREE.Mesh(icosahedronGeometry, lambertMaterial);
    scene.add(nucleus);


    /*    Sphere  Background   */
    textureSphereBg.anisotropy = 16;
    let geometrySphereBg = new THREE.SphereBufferGeometry(150, 40, 40);
    let materialSphereBg = new THREE.MeshBasicMaterial({
        side: THREE.BackSide,
        map: textureSphereBg,
    });
    sphereBg = new THREE.Mesh(geometrySphereBg, materialSphereBg);
    scene.add(sphereBg);


    /*    Moving Stars   */
    let starsGeometry = new THREE.Geometry();

    for (let i = 0; i < 50; i++) {
        let particleStar = randomPointSphere(150); 

        particleStar.velocity = THREE.MathUtils.randInt(50, 200);

        particleStar.startX = particleStar.x;
        particleStar.startY = particleStar.y;
        particleStar.startZ = particleStar.z;

        starsGeometry.vertices.push(particleStar);
    }
    let starsMaterial = new THREE.PointsMaterial({
        size: 5,
        color: "#ffffff",
        transparent: true,
        opacity: 0.8,
        map: textureStar,
        blending: THREE.AdditiveBlending,
    });
    starsMaterial.depthWrite = false;  
    stars = new THREE.Points(starsGeometry, starsMaterial);
    scene.add(stars);


    /*    Fixed Stars   */
    function createStars(texture, size, total) {
        let pointGeometry = new THREE.Geometry();
        let pointMaterial = new THREE.PointsMaterial({
            size: size,
            map: texture,
            blending: THREE.AdditiveBlending,                      
        });

        for (let i = 0; i < total; i++) {
            let radius = THREE.MathUtils.randInt(149, 70); 
            let particles = randomPointSphere(radius);
            pointGeometry.vertices.push(particles);
        }
        return new THREE.Points(pointGeometry, pointMaterial);
    }
    scene.add(createStars(texture1, 15, 20));   
    scene.add(createStars(texture2, 5, 5));
    scene.add(createStars(texture4, 7, 5));


    function randomPointSphere (radius) {
        let theta = 2 * Math.PI * Math.random();
        let phi = Math.acos(2 * Math.random() - 1);
        let dx = 0 + (radius * Math.sin(phi) * Math.cos(theta));
        let dy = 0 + (radius * Math.sin(phi) * Math.sin(theta));
        let dz = 0 + (radius * Math.cos(phi));
        return new THREE.Vector3(dx, dy, dz);
    }
}


  // Caps the rendering loop to a specified frame interval
 function limitFPS(interval) {
    requestAnimationFrame(limitFPS.bind(this, interval));
    delta += clock.getDelta();

    if (delta > interval) {
       animate();
     delta = delta % interval;
    }
  }


function animate() {

    //Stars  Animation
    stars.geometry.vertices.forEach(function (v) {
        v.x += (0 - v.x) / v.velocity;
        v.y += (0 - v.y) / v.velocity;
        v.z += (0 - v.z) / v.velocity;

        v.velocity -= 0.3;

        if (v.x <= 5 && v.x >= -5 && v.z <= 5 && v.z >= -5) {
            v.x = v.startX;
            v.y = v.startY;
            v.z = v.startZ;
            v.velocity = THREE.MathUtils.randInt(50, 300);
        }
    });


    //Nucleus Animation
    nucleus.geometry.vertices.forEach(function (v) {
        let time = Date.now();
        v.normalize();
        let distance = nucleus.geometry.parameters.radius + noise.noise3D(
            v.x + time * 0.0005,
            v.y + time * 0.0003,
            v.z + time * 0.0008
        ) * blobScale;
        v.multiplyScalar(distance);
    })
    nucleus.geometry.verticesNeedUpdate = true;
    nucleus.geometry.normalsNeedUpdate = true;
    nucleus.geometry.computeVertexNormals();
    nucleus.geometry.computeFaceNormals();
    nucleus.rotation.y += 0.002;


    //Sphere Beckground Animation
    sphereBg.rotation.x += 0.002;
    sphereBg.rotation.y += 0.002;
    sphereBg.rotation.z += 0.002;

    
    controls.update();
    stars.geometry.verticesNeedUpdate = true;
    renderer.render(scene, camera);
}



/*     Resize     */
window.addEventListener("resize", () => {
    clearTimeout(timeout_Debounce);
    timeout_Debounce = setTimeout(onWindowResize, 80);
});
function onWindowResize() {
    camera.aspect = container.clientWidth / container.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(container.clientWidth, container.clientHeight);
}



/*     Fullscreen btn     */
let fullscreen;
let fsEnter = document.querySelector(".fullscr");
fsEnter.addEventListener('click', function (e) {
    e.preventDefault();
    if (!fullscreen) {
        fullscreen = true;
        document.documentElement.requestFullscreen();
        fsEnter.innerHTML = "Exit Fullscreen";
    }
    else {
        fullscreen = false;
        document.exitFullscreen();
        fsEnter.innerHTML = "Go Fullscreen";
    }
});
</script>

</body>
</html>
