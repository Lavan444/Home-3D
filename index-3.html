<!-- =========================================================
VITEL GLOBAL - 3D HERO BANNER
HTML + CSS + JAVASCRIPT + WEBGL
========================================================= -->

<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Vitel Global Hero</title>

<!-- THREE JS -->
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<!-- GSAP -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet"
/>

<style>

/* =========================================================
GLOBAL
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow-x:hidden;
    font-family:'Poppins',sans-serif;
    background:#060816;
    color:#fff;
}

/* =========================================================
VITEL HERO SECTION
========================================================= */

#vitelHeroBanner{
    position:relative;
    width:100%;
    height:100vh;
    overflow:hidden;
    background:
    linear-gradient(
    to bottom,
    rgba(5, 8, 20, 0),
    rgba(4, 6, 15, 0)),
    url("./space.png");
    background-size:cover;
    background-position:bottom;
}

/* =========================================================
WEBGL CANVAS
========================================================= */

#vitelWebGLCanvas{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    z-index:1;
}

/* =========================================================
MOON GLOW
========================================================= */

.vitelMoonGlow{
    position:absolute;
    width:153vh;
    height:130vh;
    border-radius:50%;
    top:-71.3vh;
    left:50%;
    transform:translateX(-50%);
    background:transparent;
    box-shadow:
        inset 0 0 30px  8px  rgba(255,248,210,1),
        inset 0 0 70px  25px rgba(255, 220, 130, 0),
        inset 0 0 130px 55px rgba(200,150,60,0.25),
        0 0 25px  8px  rgba(224, 219, 199, 0.103),
        0 0 60px  22px rgba(255,200,90,0.5),
        0 0 130px 45px rgba(212, 193, 167, 0.089);
        /* box-shadow:
    inset 0 0 30px 8px rgba(255,255,255,0.55),
    inset 0 0 70px 25px rgba(255,255,255,0.28),
    inset 0 0 130px 55px rgba(255,255,255,0.12),

    0 0 25px 8px rgba(255,255,255,0.45),
    0 0 60px 22px rgba(255,255,255,0.25),
    0 0 130px 45px rgba(255,255,255,0.12); */

    z-index:1;
}



/* =========================================================
CONTENT
========================================================= */

.vitelHeroContent{
    position:relative;
    z-index:5;
    text-align:center;
    width:100%;
    top:12%;
    padding:0 20px;
}

.vitelHeroTitle{
    font-size:76px;
    line-height:1.15;
    font-weight:300;
    letter-spacing:1px;
}

.vitelHeroTitle span{
    font-weight:700;
}

.vitelHeroDesc{
    margin-top:30px;
    font-size:22px;
    color:#d4d7e8;
    line-height:1.7;
}

/* =========================================================
BUTTONS
========================================================= */

.vitelHeroButtons{
    margin-top:40px;
    display:flex;
    justify-content:center;
    gap:20px;
}

.vitelHeroBtn{
    padding:16px 38px;
    border-radius:60px;
    text-decoration:none;
    color:white;
    border:1px solid rgba(255,255,255,0.4);
    background:rgba(255,255,255,0.06);
    backdrop-filter:blur(20px);
    transition:0.4s;
    font-size:16px;
}

.vitelHeroBtn:hover{
    transform:translateY(-5px);
    background:white;
    color:black;
}

/* =========================================================
ASTRONAUT
========================================================= */

#vitelAstronaut{
    position:absolute;
    bottom:0px;
    left:50%;
    transform:translateX(-50%);
    width:auto;
    z-index:10;

    filter:
    drop-shadow(0 0 40px rgba(255,255,255,0.35))
    drop-shadow(0 0 80px rgba(129,160,255,0.25));

    /* animation:vitelAstronautFloat 6s ease-in-out infinite; */
}

@keyframes vitelAstronautFloat{

    0%{
        transform:
        translateX(-50%)
        translateY(0px);
    }

    50%{
        transform:
        translateX(-50%)
        translateY(-22px);
    }

    100%{
        transform:
        translateX(-50%)
        translateY(0px);
    }

}

/* =========================================================
SERVICES FLAGS
========================================================= */

.vitelServicesWrap{
    position:absolute;
    width:100%;
    bottom:80px;
    z-index:5;

    display:flex;
    justify-content:space-around;
    align-items:flex-end;

    padding:0 60px;
}

.vitelServiceFlag{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* FLAG LINE */

.vitelServiceFlag::after{
    content:"";
    width:2px;
    height:55px;
    background:
    linear-gradient(
    to bottom,
    rgba(255,255,255,0.6),
    transparent);
}

/* FLAG DOT */

.vitelServiceFlag::before{
    content:"";
    position:absolute;
    bottom:-6px;
    width:12px;
    height:12px;
    border-radius:50%;
    background:rgba(255,255,255,0.6);

    box-shadow:
    0 0 10px rgba(255,255,255,0.7);
}

.vitelServiceFlag--offset{
    transform: translate(100px, -100px);
}


.vitelsmsFlag{
   transform: translate(150px, -190px);
}

.vitelomniflag{
    transform: translate(218px, -100px);
}

.vitelwatsappflag{
    transform: translate(-8px, -153px);
}

.vitelbusinessphoneflag{
    transform: translate(-40px, -72px);
}
/* SERVICE CARD */

.vitelServiceCard{
  padding: 9px 21px;
    border-radius: 60px;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    backdrop-filter: blur(20px);
    color: white;
    transition: 0.4s;
    cursor: pointer;
    margin-bottom: 0px;
    font-size: 14px;
}

.vitelServiceCard:hover{
    transform:
    translateY(-10px)
    scale(1.05);

    background:
    rgba(255,255,255,0.15);
}

/* =========================================================
RESPONSIVE
========================================================= */

@media(max-width:992px){

    .vitelHeroTitle{
        font-size:42px;
    }

    .vitelHeroDesc{
        font-size:16px;
    }

    .vitelServicesWrap{
        flex-wrap:wrap;
        gap:20px;
        bottom:20px;
    }

    #vitelAstronaut{
        width:120px;
    }

}

</style>
</head>

<body>

<!-- =========================================================
HERO SECTION
========================================================= -->

<section id="vitelHeroBanner">

    <!-- WEBGL -->
    <canvas id="vitelWebGLCanvas"></canvas>

    <!-- GLOW -->
    <div class="vitelMoonGlow"></div>

    <!-- CONTENT -->
    <div class="vitelHeroContent">

        <h1 class="vitelHeroTitle">

            The Smarter way to Run & Scale
            <br>

            Your <span>Business Communication</span>

        </h1>

        <p class="vitelHeroDesc">

            AI-powered unified communications for calling,
            messaging, meetings, and automation —
            all in one platform.

        </p>

        <div class="vitelHeroButtons">

            <a href="#" class="vitelHeroBtn">
                Request Demo
            </a>

            <a href="#" class="vitelHeroBtn">
                Buy Now
            </a>

        </div>

    </div>

    <!-- ASTRONAUT -->
    <img
    id="vitelAstronaut"
    src="./astronut.png"
    />

    <!-- SERVICES -->
    <div class="vitelServicesWrap">

        <div class="vitelServiceFlag vitelbusinessphoneflag">

            <div class="vitelServiceCard">
                Business Phone System
            </div>

        </div>

        <div class="vitelServiceFlag vitelwatsappflag">

            <div class="vitelServiceCard">
                Business WhatsApp
            </div>

        </div>

        <div class="vitelServiceFlag vitelomniflag">

            <div class="vitelServiceCard">
                Vitel Omnichannel
            </div>

        </div>

        <div class="vitelServiceFlag vitelsmsFlag">

            <div class="vitelServiceCard">
                Vitel SMS
            </div>

        </div>

        <div class="vitelServiceFlag vitelServiceFlag--offset">

            <div class="vitelServiceCard">
                AI Vitel Meet
            </div>

        </div>

    </div>

</section>

<script>

/* =========================================================
THREE JS WEBGL
========================================================= */

const scene = new THREE.Scene();

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

const renderer = new THREE.WebGLRenderer({
canvas:document.getElementById("vitelWebGLCanvas"),
alpha:true,
antialias:true
});

renderer.setSize(
window.innerWidth,
window.innerHeight
);

renderer.setPixelRatio(window.devicePixelRatio);

camera.position.z = 5;

/* =========================================================
STARS
========================================================= */

const starsGeometry =
new THREE.BufferGeometry();

const starsCount = 5000;

const starsPositions = [];

for(let i=0;i<starsCount;i++){

    starsPositions.push(
        (Math.random()-0.5)*2000,
        (Math.random()-0.5)*2000,
        (Math.random()-0.5)*2000
    );

}

starsGeometry.setAttribute(
"position",
new THREE.Float32BufferAttribute(
starsPositions,
3
)
);

const starsMaterial =
new THREE.PointsMaterial({
color:"#ffffff",
size:1
});

const stars =
new THREE.Points(
starsGeometry,
starsMaterial
);

scene.add(stars);

/* =========================================================
3D GLOBE
========================================================= */

const globeGeometry =
new THREE.SphereGeometry(
8,
128,
128
);

const globeTexture =
new THREE.TextureLoader().load(
"./moon-bg.png"
);

const globeMaterial =
new THREE.MeshStandardMaterial({
map:globeTexture,
roughness:1
});

const globe =
new THREE.Mesh(
globeGeometry,
globeMaterial
);

scene.add(globe);

globe.position.set(0,7,-3);

/* =========================================================
LIGHTS
========================================================= */

const ambientLight =
new THREE.AmbientLight(
0xffffff,
1.5
);

scene.add(ambientLight);

const directionalLight =
new THREE.DirectionalLight(
0xffffff,
3
);

directionalLight.position.set(
5,
5,
5
);

scene.add(directionalLight);

/* =========================================================
ANIMATE
========================================================= */

function animate(){

    requestAnimationFrame(animate);

    globe.rotation.y += 0.0015;

    stars.rotation.y += 0.0002;

    renderer.render(scene,camera);

}

animate();

/* =========================================================
RESIZE
========================================================= */

window.addEventListener(
"resize",
()=>{

camera.aspect =
window.innerWidth/window.innerHeight;

camera.updateProjectionMatrix();

renderer.setSize(
window.innerWidth,
window.innerHeight
);

});

/* =========================================================
ASTRONAUT MOVEMENT TO FLAGS
========================================================= */

const vitelAstronaut =
document.getElementById(
"vitelAstronaut"
);

// Get all flag elements
const flagElements =
document.querySelectorAll(
".vitelServiceFlag"
);

// Convert NodeList to Array for easier handling
const flags = Array.from(flagElements);

// Distance threshold - if mouse is beyond this, astronaut returns to center
const INTERACTION_THRESHOLD = 400;

// Function to calculate distance between mouse and flag
function getDistance(
mouseX,
mouseY,
flagX,
flagY
){
    const dx = mouseX - flagX;
    const dy = mouseY - flagY;
    return Math.sqrt(dx*dx + dy*dy);
}

// Function to get flag center position
function getFlagPosition(flagElement){
    const rect = flagElement.getBoundingClientRect();
    return {
        x: rect.left + rect.width/2,
        y: rect.top + rect.height/2
    };
}

// Function to find closest flag to mouse
function getClosestFlag(mouseX, mouseY){
    let closestFlag = null;
    let closestDistance = Infinity;

    flags.forEach(flag=>{
        const flagPos = getFlagPosition(flag);
        const distance = getDistance(
            mouseX,
            mouseY,
            flagPos.x,
            flagPos.y
        );

        if(distance < closestDistance){
            closestDistance = distance;
            closestFlag = flag;
        }
    });

    return {
        flag: closestFlag,
        distance: closestDistance
    };
}

// Track mouse movement and move astronaut to closest flag
document.addEventListener(
"mousemove",
(e)=>{

    // Find closest flag to mouse
    const {flag: closestFlag, distance: closestDistance} =
    getClosestFlag(
        e.clientX,
        e.clientY
    );

    // If mouse is close to a flag, move astronaut to it
    if(closestFlag && closestDistance < INTERACTION_THRESHOLD){
        // Get flag position
        const flagRect =
        closestFlag.getBoundingClientRect();

        const flagCenterX =
        flagRect.left +
        flagRect.width/2 -
        window.innerWidth/2;

        // Move astronaut to flag position
        gsap.to(
            vitelAstronaut,
            {
                x: flagCenterX,
                duration: 0.8,
                ease: "power3.out"
            }
        );
    }
    else{
        // Mouse is far from all flags, move astronaut back to center
        gsap.to(
            vitelAstronaut,
            {
                x: 0,
                duration: 0.8,
                ease: "power3.out"
            }
        );
    }

});

/* =========================================================
SERVICE HOVER MOVEMENT
========================================================= */

const vitelServices =
document.querySelectorAll(
".vitelServiceCard"
);

vitelServices.forEach((service, index)=>{

    service.addEventListener(
        "mouseenter",
        ()=>{

            // Get parent flag element
            const parentFlag =
            service.closest(
                ".vitelServiceFlag"
            );

            const flagRect =
            parentFlag
            .getBoundingClientRect();

            const targetX =
            flagRect.left +
            flagRect.width/2 -
            window.innerWidth/2;

            gsap.to(
                vitelAstronaut,
                {
                    x: targetX,
                    duration: 0.6,
                    ease: "power3.out"
                }
            );

        }
    );

});

/* =========================================================
GSAP ANIMATION
========================================================= */

gsap.registerPlugin(
ScrollTrigger
);

gsap.from(
".vitelHeroTitle",
{
y:120,
opacity:0,
duration:1.5
}
);

gsap.from(
".vitelHeroDesc",
{
y:80,
opacity:0,
duration:1.5,
delay:0.3
}
);

gsap.from(
".vitelHeroButtons",
{
y:80,
opacity:0,
duration:1.5,
delay:0.5
}
);

gsap.from(
".vitelServiceFlag",
{
y:80,
opacity:0,
stagger:0.15,
duration:1.2,
delay:0.8
}
);

/* =========================================================
SCROLL BASED ANIMATION
========================================================= */

gsap.to(
globe.rotation,
{
y:6,

scrollTrigger:{
trigger:"#vitelHeroBanner",
start:"top top",
end:"bottom top",
scrub:1
}
}
);

gsap.to(
camera.position,
{
z:3,

scrollTrigger:{
trigger:"#vitelHeroBanner",
start:"top top",
end:"bottom top",
scrub:1
}
}
);

</script>

</body>
</html>
