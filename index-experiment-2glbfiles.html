            "imports": {

    <style>
        /* =========================================================
GLOBAL
========================================================= */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow-x: hidden;
            font-family: 'Poppins', sans-serif;
            background: #060816;
            color: #fff;
        }

        /* =========================================================
VITEL HERO SECTION
========================================================= */

        #vitelHeroBanner {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background:
                linear-gradient(to bottom,
                    rgba(5, 8, 20, 0),
                    rgba(4, 6, 15, 0)),
                url("./space.png");
            background-size: cover;
            background-position: bottom;
        }

        /* =========================================================
WEBGL CANVAS
========================================================= */

        #vitelWebGLCanvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 6;
            pointer-events: none;
        }

        /* =========================================================
MOON GLOW
========================================================= */

        /* =========================================================
MOON GLOW (PERFECTLY CALIBRATED TO WEBGL SPHERE)
========================================================= */

        .vitelMoonGlow {
            position: absolute;
            /* Mathematical size match based on camera depth matrix */
            width: 133vh;
            height: 133vh;
            border-radius: 50%;

            /* Perfect vertical alignment for globe position (0, 7, -3) */
            top: -76.8vh;
            left: 50%;
            transform: translateX(-50%);
            background: transparent;

            /* Render priorities and click-through configurations */
            z-index: 2;
            pointer-events: none;

            box-shadow:
                inset 0 0 30px 8px rgba(255, 248, 210, 1),
                inset 0 0 70px 25px rgba(255, 220, 130, 0),
                inset 0 0 130px 55px rgba(200, 150, 60, 0.25),
                0 0 25px 8px rgba(224, 219, 199, 0.103),
                0 0 60px 22px rgba(255, 200, 90, 0.5),
                0 0 130px 45px rgba(212, 193, 167, 0.089);
        }




        /* =========================================================
CONTENT
========================================================= */

        .vitelHeroContent {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 100%;
            top: 12%;
            padding: 0 20px;
        }

        .vitelHeroTitle {
            font-size: 76px;
            line-height: 1.15;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .vitelHeroTitle span {
            font-weight: 700;
        }

        .vitelHeroDesc {
            margin-top: 30px;
            font-size: 22px;
            color: #d4d7e8;
            line-height: 1.7;
        }

        /* =========================================================
BUTTONS
========================================================= */

        .vitelHeroButtons {
            margin-top: 40px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .vitelHeroBtn {
            padding: 16px 38px;
            border-radius: 60px;
            text-decoration: none;
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(20px);
            transition: 0.4s;
            font-size: 16px;
        }

        .vitelHeroBtn:hover {
            transform: translateY(-5px);
            background: white;
            color: black;
        }

        /* Obsolete 2D Astronaut styles removed in favor of 3D GLB model integration */

        /* =========================================================
SERVICES FLAGS
========================================================= */

        .vitelServicesWrap {
            position: absolute;
            width: 100%;
            bottom: 80px;
            z-index: 5;

            display: flex;
            justify-content: space-around;
            align-items: flex-end;

            padding: 0 60px;
            /* pointer-events: none; */
        }

        .vitelServiceFlag {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* FLAG LINE */

        .vitelServiceFlag::after {
            content: "";
            width: 2px;
            height: 55px;
            background:
                linear-gradient(to bottom,
                    rgba(255, 255, 255, 0.6),
                    transparent);
        }

        /* FLAG DOT */

        .vitelServiceFlag::before {
            content: "";
            position: absolute;
            bottom: -6px;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);

            box-shadow:
                0 0 10px rgba(255, 255, 255, 0.7);
        }

        .vitelServiceFlag--offset {
            transform: translate(100px, -100px);
        }


        .vitelsmsFlag {
            transform: translate(150px, -190px);
        }

        .vitelomniflag {
            transform: translate(218px, -100px);
        }

        .vitelwatsappflag {
            transform: translate(-8px, -153px);
        }

        .vitelbusinessphoneflag {
            transform: translate(-40px, -72px);
        }

        /* SERVICE CARD */

        .vitelServiceCard {
            padding: 9px 21px;
            border-radius: 60px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(20px);
            color: white;
            transition: 0.4s;
            cursor: pointer;
            margin-bottom: 0px;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            /* pointer-events: none; */
        }

        .vitelServiceCard:hover {
            transform:
                /* translateY(-10px) */
                scale(1.05);

            background:
                rgba(255, 255, 255, 0.15);
        }


        /* =========================================================
        RESPONSIVE
        ========================================================= */

        @media(max-width:992px) {

            .vitelHeroTitle {
                font-size: 42px;
            }

            .vitelHeroDesc {
                font-size: 16px;
            }

            .vitelServicesWrap {
                flex-wrap: wrap;
                gap: 20px;
                bottom: 20px;
            }

        }
    </style>
</head>

    <script type="module">

        /* =========================================================
        THREE JS WEBGL & GLB LOADING
        ========================================================= */
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';

        const scene = new THREE.Scene();

        const camera = new THREE.PerspectiveCamera(
            75,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );

        const renderer = new THREE.WebGLRenderer({
            canvas: document.getElementById("vitelWebGLCanvas"),
            alpha: true,
            antialias: true
        });

        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

        renderer.setPixelRatio(window.devicePixelRatio);

        camera.position.z = 5;

        /* =========================================================
        STARS
        ========================================================= */

        const starsGeometry =
            new THREE.BufferGeometry();

        const starsCount = 1500;

        const starsPositions = [];

        for (let i = 0; i < starsCount; i++) {

            starsPositions.push(
                (Math.random() - 0.5) * 2000,
                (Math.random() - 0.5) * 2000,
                (Math.random() - 0.5) * 2000
            );

        }

        starsGeometry.setAttribute(
            "position",
            new THREE.Float32BufferAttribute(
                starsPositions,
                3
            )
        );

        const starsMaterial =
            new THREE.PointsMaterial({
                color: "#ffffff",
                size: 1
            });

        const stars =
            new THREE.Points(
                starsGeometry,
                starsMaterial
            );

        scene.add(stars);

        /* =========================================================
        3D GLOBE
        ========================================================= */

        const globeGeometry =
            new THREE.SphereGeometry(
                8,
                128,
                128
            );

        const globeTexture =
            new THREE.TextureLoader().load(
                "./moon-bg-8.png"
            );

        globeTexture.repeat.set(1, 0.75);

        const globeMaterial =
            new THREE.MeshStandardMaterial({
                map: globeTexture,
                roughness: 1
            });

        const globe =
            new THREE.Mesh(
                globeGeometry,
                globeMaterial
            );

        scene.add(globe);

        /* =========================================================
        3D ATMOSPHERE GLOW (WHITE - PERFECTLY ALIGNED)
        ========================================================= */

        const glowMaterial = new THREE.ShaderMaterial({
            vertexShader: `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        void main() {
            vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
            vViewPosition = -mvPosition.xyz;
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * mvPosition;
        }
    `,
            fragmentShader: `
        varying vec3 vNormal;
        varying vec3 vViewPosition;
        void main() {
            vec3 normal = normalize(vNormal);
            vec3 viewDir = normalize(vViewPosition);
            float intensity = pow(1.0 - max(dot(normal, viewDir), 0.0), 1.8);
            vec3 glowColor = vec3(1.0, 1.0, 1.0); 
            gl_FragColor = vec4(glowColor * intensity * 1.0, intensity);
        }
    `,
            blending: THREE.AdditiveBlending,
            side: THREE.FrontSide,
            transparent: true,
            depthWrite: false
        });

        const glowGeometry = new THREE.SphereGeometry(8.05, 128, 128);
        const moonGlowMesh = new THREE.Mesh(glowGeometry, glowMaterial);

        moonGlowMesh.position.copy(globe.position);
        scene.add(moonGlowMesh);

        globe.position.set(0, 7.5, -2);

        /* =========================================================
        ASTRONAUT INTEGRATION (GLTFLOADER)
        ========================================================= */

        let movingAstronaut = null;
        let staticAstronaut = null;
        let astronautWrapper = null;
        let mixer = null;
        const clock = new THREE.Clock();

        // Base transform variables for calibration
        let baseY = -2.0;
        let baseZ = 1.8;
        let baseRotY = Math.PI;

        // Create the wrapper group to hold the centered model
        astronautWrapper = new THREE.Group();
        astronautWrapper.name = "astronautWrapper";
        scene.add(astronautWrapper);

        function configureAstronautModel(model) {
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;
                    if (child.material) {
                        child.material.roughness = 0.45;
                        child.material.metalness = 0.7;
                        if (child.material.color) {
                            const baseColor = child.material.color.clone();
                            if (!child.material.emissive) child.material.emissive = new THREE.Color(0x000000);
                            child.material.emissive.copy(baseColor);
                            child.material.emissiveIntensity = 0.25;
                            if (child.material.envMapIntensity !== undefined) child.material.envMapIntensity = 0.8;
                            child.material.needsUpdate = true;
                        }
                    }
                }
            });
        }

        function setAstronautVisibility(useStatic) {
            if (staticAstronaut && movingAstronaut) {
                staticAstronaut.visible = useStatic;
                movingAstronaut.visible = !useStatic;
            } else if (movingAstronaut) {
                movingAstronaut.visible = true;
            } else if (staticAstronaut) {
                staticAstronaut.visible = true;
            }
        }

        // Load 3D Astronaut models
        const gltfLoader = new GLTFLoader();

        // Configure DRACOLoader to support optimized Draco-compressed models (up to 10x smaller)
        const dracoLoader = new DRACOLoader();
        dracoLoader.setDecoderPath('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/libs/draco/');
        gltfLoader.setDRACOLoader(dracoLoader);

        gltfLoader.load(
            "./astronut.glb",
            (gltf) => {
                movingAstronaut = gltf.scene;
                configureAstronautModel(movingAstronaut);
                astronautWrapper.add(movingAstronaut);
                setAstronautVisibility(false);
                calibrateAstronaut();
                if (gltf.animations && gltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(movingAstronaut);
                    const action = mixer.clipAction(gltf.animations[0]);
                    action.play();
                }
            },
            undefined,
            (error) => {
                console.error("An error occurred loading the moving astronaut:", error);
            }
        );

        gltfLoader.load(
            "./astronout-static.glb",
            (gltf) => {
                staticAstronaut = gltf.scene;
                configureAstronautModel(staticAstronaut);
                astronautWrapper.add(staticAstronaut);
                setAstronautVisibility(true);
                calibrateAstronaut();
            },
            undefined,
            (error) => {
                console.error("An error occurred loading the static astronaut:", error);
            }
        );

        // Calibrate wrapper scale and position bounds relative to model dimensions
        function calibrateAstronaut() {
            const activeModel = movingAstronaut || staticAstronaut;
            if (!activeModel || !astronautWrapper) return;

            // Reset local dimensions of model child
            activeModel.scale.set(1, 1, 1);
            activeModel.position.set(0, 0, 0);
            activeModel.rotation.set(0, 0, 0);

            // Compute size using bounding box
            const box = new THREE.Box3().setFromObject(activeModel);
            const size = box.getSize(new THREE.Vector3());
            const center = box.getCenter(new THREE.Vector3());

            // Center original geometry relative to wrapper
            activeModel.position.set(-center.x, -center.y, -center.z);

            // Responsive height target - calibrated to be smaller and sit on ground plane
            let targetHeight = 0.35;
            if (window.innerWidth < 768) {
                targetHeight = 0.35;
                baseY = -2.2;
                baseZ = 1.8;
            } else if (window.innerWidth < 992) {
                targetHeight = 0.35;
                baseY = -2.1;
                baseZ = 1.8;
            } else {
                targetHeight = 0.35;
                baseY = -2.0;
                baseZ = 1.8;
            }

            if (size.y > 0) {
                const scaleFactor = targetHeight / size.y;
                astronautWrapper.scale.set(scaleFactor, scaleFactor, scaleFactor);
            }

            // Maintain current animated X, update Y and Z responsive bases
            astronautWrapper.position.set(
                astronautWrapper.position.x !== undefined ? astronautWrapper.position.x : 0,
                baseY,
                baseZ
            );

            // Set cinematic default rotation facing straight away from viewer (towards planet)
            astronautWrapper.rotation.set(0.0, baseRotY, 0);
        }

        /* =========================================================
        LIGHTS
        ========================================================= */

        const ambientLight =
            new THREE.AmbientLight(
                0xffffff,
                0.8
            );

        scene.add(ambientLight);

        const directionalLight =
            new THREE.DirectionalLight(
                0xffffff,
                1.5
            );

        directionalLight.position.set(
            5,
            5,
            5
        );

        scene.add(directionalLight);

        // Premium multi-colored dynamic lights tailored for astronaut metallic details
        const astronautKeyLight = new THREE.DirectionalLight(0xfff0dd, 2.5); // Warm sun accent
        astronautKeyLight.position.set(5, 5, 2);
        scene.add(astronautKeyLight);

        const astronautRimLight = new THREE.DirectionalLight(0xa855f7, 4.0); // Vibrant neon purple from nebula
        astronautRimLight.position.set(-6, -3, -2);
        scene.add(astronautRimLight);

        const astronautFillLight = new THREE.DirectionalLight(0x3b82f6, 2.0); // Cool space ambient blue
        astronautFillLight.position.set(4, -4, 1);
        scene.add(astronautFillLight);

        /* =========================================================
        ANIMATE
        ========================================================= */

        function animate() {

            requestAnimationFrame(animate);

            globe.rotation.y += 0.0015;
            stars.rotation.y += 0.0002;

            // Update volumetric glowing atmospheric aura snapping
            moonGlowMesh.position.copy(globe.position);

            const delta = clock.getDelta();
            const time = clock.getElapsedTime();

            // Perform dynamic skeletal animations
            if (mixer) {
                mixer.update(delta);
            }

            // Implement a cinematic slow floating drift overlay on the wrapper group
            if (astronautWrapper && (movingAstronaut || staticAstronaut)) {
                // Procedural Y-axis float drift
                astronautWrapper.position.y = baseY;

                // Subtle random roll rotation
                astronautWrapper.rotation.z = Math.cos(time * 0.6) * 0.03;

                // Update movement toward the selected target along the facing direction
                updateAstronautMovement(delta);
            }

            renderer.render(scene, camera);

        }

        animate();

        /* =========================================================
        RESIZE
        ========================================================= */

        window.addEventListener(
            "resize",
            () => {

                camera.aspect =
                    window.innerWidth / window.innerHeight;

                camera.updateProjectionMatrix();

                renderer.setSize(
                    window.innerWidth,
                    window.innerHeight
                );

                calibrateAstronaut();

            });


        /* =========================================================
        ASTRONAUT MOVEMENT TO FLAGS
        ========================================================= */

        // Get all flag elements
        const flagElements =
            document.querySelectorAll(
                ".vitelServiceFlag"
            );

        const flags = Array.from(flagElements);

        // Distance threshold - if mouse is beyond this, astronaut returns to center
        const INTERACTION_THRESHOLD = 400;

        function getDistance(
            mouseX,
            mouseY,
            flagX,
            flagY
        ) {
            const dx = mouseX - flagX;
            const dy = mouseY - flagY;
            return Math.sqrt(dx * dx + dy * dy);
        }

        function getFlagPosition(flagElement) {
            const rect = flagElement.getBoundingClientRect();
            return {
                x: rect.left + rect.width / 2,
                y: rect.top + rect.height / 2
            };
        }

        function getClosestFlag(mouseX, mouseY) {
            let closestFlag = null;
            let closestDistance = Infinity;

            flags.forEach(flag => {
                const flagPos = getFlagPosition(flag);
                const distance = getDistance(
                    mouseX,
                    mouseY,
                    flagPos.x,
                    flagPos.y
                );

                if (distance < closestDistance) {
                    closestDistance = distance;
                    closestFlag = flag;
                }
            });

            return {
                flag: closestFlag,
                distance: closestDistance
            };
        }

        const pointer = new THREE.Vector2();
        const raycaster = new THREE.Raycaster();
        let moveTarget = null;
        const approachSpeed = 1.8;
        const returnSpeed = 0.9;
        const rotateLerp = 0.15;
        const approachOffset = 0.35;

        function getFlagTargetPosition(flagRect) {
            const centerX = flagRect.left + flagRect.width / 2;
            const centerY = flagRect.top + flagRect.height / 2;
            pointer.set((centerX / window.innerWidth) * 2 - 1, -(centerY / window.innerHeight) * 2 + 1);
            raycaster.setFromCamera(pointer, camera);

            const targetPos = new THREE.Vector3();
            const rayOrigin = raycaster.ray.origin.clone();
            const rayDir = raycaster.ray.direction.clone();

            // Project the screen position onto the plane at fixed depth baseZ for constant size.
            if (Math.abs(rayDir.z) > 1e-6) {
                const t = (baseZ - rayOrigin.z) / rayDir.z;
                if (t > 0) {
                    raycaster.ray.at(t, targetPos);
                    targetPos.y = baseY;
                    targetPos.z = baseZ;
                    return targetPos;
                }
            }

            // Fallback: horizontal mapping to X and fixed Y/Z.
            const flagCenterX = flagRect.left + flagRect.width / 2 - window.innerWidth / 2;
            const distanceToCamera = camera.position.z - baseZ;
            const halfFovRad = (camera.fov * Math.PI) / 360;
            const aspect = window.innerWidth / window.innerHeight;
            const max3DWidth = Math.tan(halfFovRad) * distanceToCamera * aspect * 1.2;
            const threeX = (flagCenterX / (window.innerWidth / 2)) * max3DWidth;
            return new THREE.Vector3(threeX, baseY, baseZ);
        }

        function getCenterTarget() {
            return new THREE.Vector3(0, baseY, baseZ);
        }

        function setAstronautTarget(targetPos) {
            if (!astronautWrapper) {
                moveTarget = targetPos.clone();
                return;
            }

            // Force target Z to baseZ so perspective doesn't change perceived size
            targetPos = targetPos.clone();
            targetPos.z = baseZ;

            const currentPos = astronautWrapper.position.clone();
            currentPos.y = targetPos.y;
            currentPos.z = baseZ;
            const direction = targetPos.clone().sub(currentPos).normalize();
            moveTarget = targetPos.clone().sub(direction.multiplyScalar(approachOffset));
            moveTarget.z = baseZ;
        }

        function clearAstronautTarget() {
            moveTarget = getCenterTarget();
        }

        function updateAstronautMovement(delta) {
            if (!astronautWrapper) return;

            const floatY = baseY;
            const currentPos = astronautWrapper.position;
            const basePos = new THREE.Vector3(0, floatY, baseZ);
            let targetPos = moveTarget ? moveTarget.clone() : basePos.clone();
            targetPos.y = floatY;

            const direction = targetPos.clone().sub(currentPos);
            direction.y = 0;
            const distance = direction.length();

            const desiredRotY = moveTarget ? Math.atan2(direction.x, -direction.z) : baseRotY;
            astronautWrapper.rotation.y = THREE.MathUtils.lerp(astronautWrapper.rotation.y, desiredRotY, Math.min(delta * rotateLerp * 10, 1));

            if (moveTarget && distance > 0.02) {
                setAstronautVisibility(false);
                const isReturningToCenter = moveTarget.x === 0 && moveTarget.z === baseZ;
                const speed = isReturningToCenter ? returnSpeed : approachSpeed;
                const moveAmount = Math.min(speed * delta, distance);
                astronautWrapper.position.add(direction.normalize().multiplyScalar(moveAmount));
                if (astronautWrapper.position.distanceTo(targetPos) <= 0.02) {
                    astronautWrapper.position.copy(targetPos);
                }
            } else if (!moveTarget) {
                setAstronautVisibility(true);
                astronautWrapper.position.copy(basePos);
            } else {
                setAstronautVisibility(true);
                astronautWrapper.position.copy(targetPos);
            }
        }

        // Track mouse movement and move astronaut to closest flag
        document.addEventListener("mousemove", (e) => {
            const { flag: closestFlag, distance: closestDistance } = getClosestFlag(e.clientX, e.clientY);

            if (closestFlag && closestDistance < INTERACTION_THRESHOLD) {
                const flagRect = closestFlag.getBoundingClientRect();
                const targetPos = getFlagTargetPosition(flagRect);
                setAstronautTarget(targetPos);
            } else {
                clearAstronautTarget();
            }
        });

        /* =========================================================
        SERVICE HOVER MOVEMENT
        ========================================================= */

        const vitelServices =
            document.querySelectorAll(
                ".vitelServiceCard"
            );

        vitelServices.forEach((service, index) => {

            service.addEventListener("mouseenter", () => {
                const parentFlag = service.closest(".vitelServiceFlag");

                const flagRect = parentFlag.getBoundingClientRect();
                const targetPos = getFlagTargetPosition(flagRect);
                setAstronautTarget(targetPos);
            });

            service.addEventListener("mouseleave", () => {
                clearAstronautTarget();
            });

        });

        /* =========================================================
        GSAP ANIMATION
        ========================================================= */

        gsap.registerPlugin(
            ScrollTrigger
        );

        gsap.from(
            ".vitelHeroTitle",
            {
                y: 120,
                opacity: 0,
                duration: 1.5
            }
        );

        gsap.from(
            ".vitelHeroDesc",
            {
                y: 80,
                opacity: 0,
                duration: 1.5,
                delay: 0.3
            }
        );

        gsap.from(
            ".vitelHeroButtons",
            {
                y: 80,
                opacity: 0,
                duration: 1.5,
                delay: 0.5
            }
        );

        gsap.from(
            ".vitelServiceFlag",
            {
                y: 80,
                opacity: 0,
                stagger: 0.15,
                duration: 1.2,
                delay: 0.8
            }
        );

        /* =========================================================
        SCROLL BASED ANIMATION
        ========================================================= */

        gsap.to(
            globe.rotation,
            {
                y: 6,

                scrollTrigger: {
                    trigger: "#vitelHeroBanner",
                    start: "top top",
                    end: "bottom top",
                    scrub: 1
                }
            }
        );

        gsap.to(
            camera.position,
            {
                z: 3,

                scrollTrigger: {
                    trigger: "#vitelHeroBanner",
                    start: "top top",
                    end: "bottom top",
                    scrub: 1
                }
            }
        );

    </script>

</body>

</html>
