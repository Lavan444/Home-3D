<!-- 
Tech Stack:
- HTML
- CSS
- Three.js
- GSAP ScrollTrigger
- Mouse Interaction Animation

Features:
✅ 3D Moon Planet
✅ Floating Astronaut
✅ Mouse-based astronaut movement
✅ Scroll animations
✅ Service hover interaction
✅ Modern futuristic hero section
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Vitel Global</title>

  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, Helvetica, sans-serif;
    }

    body{
      overflow-x:hidden;
      background:#090b1a;
      color:white;
    }

    .hero{
      position:relative;
      width:100%;
      height:100vh;
      overflow:hidden;
      background:linear-gradient(to bottom,#11152c,#090b1a);
    }

    #bgCanvas{
      position:absolute;
      top:0;
      left:0;
      width:100%;
      height:100%;
    }

    .overlay{
      position:absolute;
      inset:0;
      background:rgba(0,0,0,0.2);
      z-index:1;
    }

    .content{
      position:relative;
      z-index:3;
      text-align:center;
      top:18%;
      width:100%;
    }

    .content h1{
      font-size:72px;
      line-height:1.2;
      font-weight:300;
      letter-spacing:1px;
    }

    .content h1 span{
      font-weight:700;
    }

    .content p{
      margin-top:25px;
      color:#cfcfe0;
      font-size:20px;
      line-height:1.7;
    }

    .buttons{
      margin-top:35px;
      display:flex;
      justify-content:center;
      gap:20px;
    }

    .btn{
      padding:15px 35px;
      border-radius:40px;
      border:1px solid rgba(255,255,255,0.5);
      color:white;
      text-decoration:none;
      transition:0.4s;
      backdrop-filter:blur(10px);
    }

    .btn:hover{
      background:white;
      color:black;
      transform:translateY(-3px);
    }

    .services{
      position:absolute;
      bottom:70px;
      width:100%;
      z-index:5;
      display:flex;
      justify-content:space-around;
      align-items:center;
      padding:0 60px;
    }

    .service{
      position:relative;
      padding:16px 28px;
      border-radius:40px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.2);
      backdrop-filter:blur(12px);
      cursor:pointer;
      transition:0.4s;
      color:white;
      font-size:18px;
    }

    .service:hover{
      transform:translateY(-12px) scale(1.05);
      background:rgba(255,255,255,0.15);
    }

    .astronaut{
      position:absolute;
      width:180px;
      left:50%;
      bottom:110px;
      transform:translateX(-50%);
      z-index:4;
      transition:0.2s linear;
      pointer-events:none;
      filter:drop-shadow(0 0 20px rgba(255,255,255,0.5));
    }

    .scroll-section{
      height:120vh;
      background:#0d1020;
      display:flex;
      align-items:center;
      justify-content:center;
      font-size:60px;
      color:white;
    }

    @media(max-width:992px){

      .content h1{
        font-size:44px;
      }

      .content p{
        font-size:16px;
        padding:0 20px;
      }

      .services{
        flex-wrap:wrap;
        gap:15px;
      }

      .astronaut{
        width:120px;
      }

    }

  </style>
</head>
<body>

  <section class="hero">

    <canvas id="bgCanvas"></canvas>

    <div class="overlay"></div>

    <div class="content">

      <h1>
        The Smarter way to Run & Scale <br>
        Your <span>Business Communication</span>
      </h1>

      <p>
        AI-powered unified communications for calling, messaging, meetings,
        <br>
        and automation — all in one platform.
      </p>

      <div class="buttons">
        <a href="#" class="btn">Request Demo</a>
        <a href="#" class="btn">Buy Now</a>
      </div>

    </div>

    <img
      class="astronaut"
      id="astronaut"
      src="https://cdn-icons-png.flaticon.com/512/3212/3212608.png"
    />

    <div class="services">

      <div class="service">Business Phone System</div>
      <div class="service">Business WhatsApp</div>
      <div class="service">Vitel Omnichannel</div>
      <div class="service">Vitel SMS</div>
      <div class="service">AI Vitel Meet</div>

    </div>

  </section>

  <section class="scroll-section">
    Scroll Animation Section
  </section>

<script>

  // ===========================
  // THREE JS SCENE
  // ===========================

  const scene = new THREE.Scene();

  const camera = new THREE.PerspectiveCamera(
    75,
    window.innerWidth / window.innerHeight,
    0.1,
    1000
  );

  const renderer = new THREE.WebGLRenderer({
    canvas:document.getElementById('bgCanvas'),
    alpha:true,
    antialias:true
  });

  renderer.setSize(window.innerWidth, window.innerHeight);

  // ===========================
  // PLANET
  // ===========================

  const geometry = new THREE.SphereGeometry(6,64,64);

  const material = new THREE.MeshStandardMaterial({
    color:0xcfc4d6,
    roughness:0.8,
    metalness:0.2,
  });

  const planet = new THREE.Mesh(geometry, material);

  scene.add(planet);

  planet.position.set(0,5,-8);

  // ===========================
  // LIGHTS
  // ===========================

  const light = new THREE.PointLight(0xffffff,4);

  light.position.set(5,5,5);

  scene.add(light);

  const ambient = new THREE.AmbientLight(0xffffff,1.2);

  scene.add(ambient);

  camera.position.z = 10;

  // ===========================
  // STARS
  // ===========================

  const starGeometry = new THREE.BufferGeometry();
  const starCount = 2000;

  const positions = [];

  for(let i=0;i<starCount;i++){

    positions.push(
      (Math.random()-0.5)*2000,
      (Math.random()-0.5)*2000,
      (Math.random()-0.5)*2000
    );

  }

  starGeometry.setAttribute(
    'position',
    new THREE.Float32BufferAttribute(positions,3)
  );

  const starMaterial = new THREE.PointsMaterial({
    color:0xffffff,
    size:1
  });

  const stars = new THREE.Points(starGeometry,starMaterial);

  scene.add(stars);

  // ===========================
  // ANIMATION LOOP
  // ===========================

  function animate(){

    requestAnimationFrame(animate);

    planet.rotation.y += 0.0015;

    stars.rotation.y += 0.0003;

    renderer.render(scene,camera);

  }

  animate();

  // ===========================
  // RESIZE
  // ===========================

  window.addEventListener('resize',()=>{

    camera.aspect = window.innerWidth/window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(window.innerWidth,window.innerHeight);

  });

  // ===========================
  // ASTRONAUT MOUSE MOVEMENT
  // ===========================

  const astronaut = document.getElementById("astronaut");

  document.addEventListener("mousemove",(e)=>{

    let x = (e.clientX / window.innerWidth - 0.5) * 250;

    astronaut.style.transform =
      `translateX(${x}px)`;

  });

  // ===========================
  // SERVICE INTERACTION
  // ===========================

  const services = document.querySelectorAll(".service");

  services.forEach(service=>{

    service.addEventListener("mouseenter",()=>{

      const rect = service.getBoundingClientRect();

      gsap.to(astronaut,{
        x:rect.left - window.innerWidth/2 + 100,
        duration:1,
        ease:"power3.out"
      });

    });

  });

  // ===========================
  // GSAP SCROLL ANIMATION
  // ===========================

  gsap.registerPlugin(ScrollTrigger);

  gsap.from(".content h1",{
    y:100,
    opacity:0,
    duration:1.5
  });

  gsap.from(".content p",{
    y:80,
    opacity:0,
    duration:1.5,
    delay:0.3
  });

  gsap.from(".buttons",{
    y:80,
    opacity:0,
    duration:1.5,
    delay:0.5
  });

  gsap.to(".hero",{
    scrollTrigger:{
      trigger:".hero",
      start:"top top",
      end:"bottom top",
      scrub:1
    },
    scale:1.1
  });

</script>

</body>
</html>
